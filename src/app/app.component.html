<div class="row">
  <h1>Unique Visitors on Homepage</h1>
  <div class="col">
    <ngx-charts-advanced-pie-chart
      [view]="view"
      scheme="cool"
      [results]="single"
      [gradient]="gradient"
      (select)="onSelect($event)"
      (activate)="onActivate($event)"
      (deactivate)="onDeactivate($event)"
    >
    </ngx-charts-advanced-pie-chart>
  </div>
  <div class="col">
    <button (click)="onRandomData()">Random Data</button>
  </div>
</div>
